<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="200" height="200" shape-rendering="geometricPrecision">
  <style>
    #spinner-blue { animation: spinner-blue 1500ms linear infinite }
    #spinner-teal { animation: spinner-teal 1500ms linear infinite }
    @keyframes spinner-blue {
      0% { transform: translate(255.829697px,248.779999px) rotate(0deg) }
      25.333333% { transform: translate(255.829697px,248.779999px) rotate(-90deg) }
      50.666667% { transform: translate(255.829697px,248.779999px) rotate(-360deg) }
      76% { transform: translate(255.829697px,248.779999px) rotate(-450deg) }
      100% { transform: translate(255.829697px,248.779999px) rotate(-720deg) }
    }
    @keyframes spinner-teal {
      0% { transform: translate(255.875px,248.625px) rotate(90deg) }
      50.666667% { transform: translate(255.875px,248.625px) rotate(-0.106014deg); animation-timing-function: cubic-bezier(.435,.145,.57,.855) }
      100% { transform: translate(255.875px,248.625px) rotate(-269.999599deg) }
    }
    @media (prefers-reduced-motion: reduce) {
      #spinner-blue, #spinner-teal { animation: none }
    }
  </style>
  <defs>
    <linearGradient id="brand-blue" x1=".075281" y1="-.000446" x2=".08956" y2=".999777">
      <stop stop-color="#7ab2db" />
      <stop offset="1" stop-color="#7ab2db" stop-opacity=".05" />
    </linearGradient>
    <linearGradient id="brand-teal" x1="0" y1=".5" x2="1" y2=".5">
      <stop stop-color="#168879" />
      <stop offset="1" stop-color="#168879" stop-opacity=".05" />
    </linearGradient>
  </defs>
  <g transform="matrix(.780619 0 0 .780619 52.859110 54.009409)">
    <g id="spinner-blue" transform="translate(255.829697 248.779999)">
      <g transform="scale(.869763) translate(-255.829697 -248.779999)">
        <path d="M255.75 114.37C328.908976 115.915449 387.409384 175.664702 387.409384 248.84S328.908976 381.764551 255.75 383.31" transform="translate(3)" fill="none" stroke="url(#brand-blue)" stroke-width="20" stroke-linecap="round" />
      </g>
    </g>
    <g id="spinner-teal" transform="translate(255.875 248.625) rotate(90)">
      <g transform="translate(-255.875 -248.625)">
        <path d="M88 249v-.5C88 157.373016 161.873016 83.5 253 83.5S418 157.373016 418 248.5v.5" transform="translate(3)" fill="none" stroke="url(#brand-teal)" stroke-width="20" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
